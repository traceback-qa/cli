name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Traceback CLI
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Before opening, please run `traceback doctor` to ensure your local setup and credentials are valid.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What command(s) did you run?
      placeholder: |
        1. traceback tests
        2. select Mobile tests
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Command Output / Logs
      description: Please paste terminal output with `--debug` flag if available.
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu / Debian / other)
        - Windows (WSL)
        - Windows (Native)
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js Version
      placeholder: e.g. v20.14.0
    validations:
      required: true

  - type: input
    id: cli_version
    attributes:
      label: Traceback CLI Version
      placeholder: e.g. 1.0.2
    validations:
      required: true
